name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build WASM
        run: cargo build --target wasm32-unknown-unknown --release

      # Two snapshots for before/after comparisons, served at /before/ and
      # /after/ but not linked from the game: the original, and the
      # overhaul exactly as first committed, before any follow-up fixes.
      # Each version's build.rs downloads its own fonts and JS.
      - name: Check out the before version
        uses: actions/checkout@v4
        with:
          ref: bb566d6ef7b127dbb2696de0bb07dd1689e7d0e9
          path: before

      - name: Build the before version
        working-directory: before
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Check out the after version
        uses: actions/checkout@v4
        with:
          ref: 6d90c2dbf8c1961f0960f6526dd0e18e87e97492
          path: after

      - name: Build the after version
        working-directory: after
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Prepare deployment
        run: |
          # The overhauled game embeds its sprites, textures, sound effects
          # and levels in the wasm; music streams in (MP3 on the web, which
          # every browser decodes).
          package() {
            mkdir -p "$2/assets/music"
            cp -r "$1/index.html" "$1/js" "$2/"
            cp "$1"/assets/music/*.mp3 "$2/assets/music/"
            cp "$1/target/wasm32-unknown-unknown/release/infestation.wasm" "$2/"
          }
          package . dist
          package after dist/after
          # The original loads its assets at runtime.
          mkdir -p dist/before
          cp -r before/index.html before/js before/assets dist/before/
          cp before/target/wasm32-unknown-unknown/release/infestation.wasm dist/before/
          # Each page loads its wasm from the same directory once deployed.
          sed -i 's|target/wasm32-unknown-unknown/release/||' \
            dist/index.html dist/after/index.html dist/before/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
