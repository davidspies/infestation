name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build WASM
        run: cargo build --target wasm32-unknown-unknown --release

      # build.rs downloads the fonts and miniquad's JS. Sprites, textures,
      # sound effects and levels are embedded in the wasm; music streams in
      # (MP3 on the web, which every browser decodes).
      - name: Prepare deployment
        run: |
          mkdir -p dist/assets/music
          cp index.html dist/
          cp -r js dist/
          cp assets/music/*.mp3 dist/assets/music/
          cp target/wasm32-unknown-unknown/release/infestation.wasm dist/
          # Update wasm path in index.html for deployment
          sed -i 's|target/wasm32-unknown-unknown/release/||' dist/index.html

      # The original version, from before the visual overhaul, served at
      # /classic/ for comparison. Its build.rs downloads its font and JS.
      - name: Check out the classic version
        uses: actions/checkout@v4
        with:
          ref: bb566d6ef7b127dbb2696de0bb07dd1689e7d0e9
          path: classic

      - name: Build the classic version
        working-directory: classic
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Add the classic version
        run: |
          mkdir -p dist/classic
          cp classic/index.html dist/classic/
          cp -r classic/js classic/assets dist/classic/
          cp classic/target/wasm32-unknown-unknown/release/infestation.wasm dist/classic/
          sed -i 's|target/wasm32-unknown-unknown/release/||' dist/classic/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
