[package]
name = "infestation"
version = "0.1.0"
edition = "2024"
default-run = "infestation"

[lib]
name = "infestation"
path = "src/lib.rs"

[[bin]]
name = "infestation"
path = "src/main.rs"

[[bin]]
name = "editor"
path = "src/bin/editor.rs"

[dependencies]
base64 = "*"
csv = "*"
enum-map = "*"
flate2 = "*"
jpeg-decoder = "*"
log = "*"
# Pinned for the unreleased fix to spurious font atlas growth (text: avoid
# spurious font atlas growth). Back to a release once one includes it.
macroquad = { git = "https://github.com/not-fl3/macroquad", rev = "8d602d3f8ebb8a3a582ee15d92983bbb81ee3ef6", features = ["audio"] }
quad-gamepad = { path = "../quad-gamepad" }
quad-url = "*"
serde = { version = "*", features = ["derive"] }
serde_json = "*"
serde_plain = "*"

[target.'cfg(target_arch = "wasm32")'.dependencies]
quad-storage = "*"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = "*"
directories = "*"
keepawake = "*"

[build-dependencies]
ureq = "*"
