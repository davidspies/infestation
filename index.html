<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#07060a">
    <title>Infestation</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #07060a;
            height: 100vh;
            overflow: hidden;
        }
        .game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        canvas {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            outline: none;
            display: block;
        }
        /* Sits behind the canvas, which hides it once the game draws. */
        .loading {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 1.4rem;
            color: #a79fb5;
            font-family: system-ui, sans-serif;
            letter-spacing: 0.12em;
        }
        .loading .spinner {
            width: 42px;
            height: 42px;
            border: 4px solid #2b2538;
            border-top-color: #f2c14e;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        canvas:not(:focus) + .focus-overlay {
            opacity: 1;
            pointer-events: auto;
        }
        .focus-overlay {
            position: absolute;
            inset: 0;
            z-index: 2;
            background: rgba(7, 6, 10, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }
        .focus-overlay span {
            padding: 0.7em 1.6em;
            border-radius: 999px;
            background: #f2c14e;
            color: #1d1726;
            font-family: system-ui, sans-serif;
            font-weight: 800;
            font-size: 1.6rem;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="loading"><div class="spinner"></div>LOADING</div>
        <canvas id="glcanvas" tabindex="1" width="1024" height="1024"></canvas>
        <div class="focus-overlay" onclick="document.getElementById('glcanvas').focus()"><span>&#9654; Click to play</span></div>
    </div>
    <script src="js/gl.js"></script>
    <script src="js/sapp_jsutils.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/quad-storage.js"></script>
    <script src="js/quad-url.js"></script>
    <script src="js/quad-gamepad.js"></script>
    <script src="js/quad-touch.js"></script>
    <script src="js/screen-wake.js"></script>
    <script src="js/progress.js"></script>
    <script src="js/desktop-only.js"></script>
    <script>loadIfSupported("target/wasm32-unknown-unknown/release/infestation.wasm");</script>
</body>
</html>
